<div class="container divRuleta">
  <img src="./assets/imgs/pointer.png" alt="" class="marcadorRuleta" />
  <img
    src="./assets/imgs/RULETA.png"
    id="ruleta"
    [class]="usuario.canRuleta ? '' : 'disabled'"

    }}"
    (click)="aPorElBoteJS()"
  />
</div>
