<div class="container-fluid my-5">
    <div class="row mx-auto">
        <div class="rewardSection topReward" *ngIf="usuarios">
            <div *ngFor="let user of usuarios; index as i" class="reward">
                <div *ngIf="user.id !== null">
                    <app-user-reward class="" [usuario]="user"></app-user-reward>
                </div>
            </div>
        </div>

        <div class="panel">
            <app-panel [panel]="panelActual"></app-panel>
        </div>
        <div class="ruleta">
            <div class="mx-auto row">
                <div class="col-12 mx-auto">
                    <img style="margin: 0 auto;" src="../../../assets/imgs/logo.png" class="center" alt="" />
                </div>
                <div class="col-12 mx-auto">
                    <app-ruleta [disabled]="false" [usuario]="usuarios[0]"></app-ruleta>
                </div>
            </div>
        </div>
    </div>
    <div class="mt-5 row bottomReward">
        <div *ngFor="let user of usuarios" class="mx-auto">
            <div *ngIf="user.id !== null" class="mt-3">
                <app-user-reward [usuario]="user"></app-user-reward>
            </div>
        </div>
    </div>
    <div class="row mt-5 mx-auto" style="width: 70%;">
        <img src="../../../assets/imgs/publico/{{index}}.png" class="rounded img-fluid  mx-auto d-block" alt="" *ngFor="let index of publico" />

    </div>
</div>
